<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KhabarBawaal Stats</title>
<meta name="theme-color" content="#0d0d0d">
<style>
  :root { --bg: #0d0d0d; --card: #1a1a1a; --line: #2a2a2a; --text: #f2f2f2; --muted: #9a9a9a;
    --accent: #FFD400; --red: #E50914; --green: #3ddc84; --amber: #ffb020; --blue: #4ea1ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,13,13,.94); backdrop-filter: blur(10px);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; }
  header a { color: var(--text); text-decoration: none; font-size: 22px; padding: 4px 8px; }
  header h1 { font-size: 19px; margin: 0; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 30px);
    display: flex; flex-direction: column; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  h2 { margin: 0 0 10px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .gauge { margin: 10px 0 14px; }
  .gauge .top { display: flex; justify-content: space-between; font-weight: 600; }
  .bar { height: 12px; background: #262626; border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; border-radius: 999px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .kpi { background: #222; border-radius: 10px; padding: 10px; }
  .kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .row { display: grid; grid-template-columns: 110px minmax(0,1fr) 72px; gap: 8px; align-items: center; margin: 7px 0; font-size: 14px; }
  .row .bar { margin: 0; height: 10px; }
  .row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .verdict { padding: 12px; border-radius: 10px; font-weight: 600; margin-top: 8px; }
  .ok { background: rgba(61,220,132,.12); color: var(--green); }
  .tight { background: rgba(255,176,32,.14); color: var(--amber); }
  .over { background: rgba(229,9,20,.16); color: #ff6b6b; }
  a.link { color: var(--blue); }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: #222; color: var(--text); border-radius: 999px;
    padding: 8px; font-weight: 700; }
  .seg button.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .rep { display: flex; flex-direction: column; gap: 8px; }
  .rep .line { display: flex; gap: 10px; align-items: baseline; }
  .rep .line b { min-width: 24px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<header><a href="./" aria-label="Back">‹</a><h1>📊 Stats</h1></header>
<main>
  <section id="report"><h2>📋 Report</h2><div class="muted">Loading…</div></section>
  <section id="insta"><h2>📈 Instagram</h2><div class="muted">Loading…</div></section>
  <section id="boosts"><h2>🚀 Boosts</h2><div class="muted">Loading…</div></section>
  <section id="plan"><h2>Claude plan usage</h2><div class="muted">Loading…</div></section>
  <section id="capacity"><h2>Room for more posts</h2><div class="muted">Loading…</div></section>
  <section id="robot"><h2>KhabarBawaal robot</h2><div class="muted">Loading…</div></section>
  <section id="adhoc"><h2>Your own Claude use</h2><div class="muted">Loading…</div></section>
</main>
<script>
const JOB_NAMES = { news: 'News posts', fun: 'Fun posts', create: '➕ Create posts', top10_viral: 'Top 5 Viral',
  top10_day: 'Top 5 News', thought: 'Thought of Day', market_open: 'Market Brief', market_preopen: 'Pre-open',
  market_close: 'Closing Bell', 'fun bank': 'Joke bank', other: 'Other' };
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(Math.round(n));
const tokens = t => (t.input || 0) + (t.output || 0) + (t.cache_read || 0) + (t.cache_write || 0);
// How much tokens count against the plan (same ratios as API pricing): cached reads are cheap,
// output is expensive. Used for the robot-vs-you split and the capacity estimate.
const weighted = t => (t.input || 0) + 5 * (t.output || 0) + 1.25 * (t.cache_write || 0) + 0.1 * (t.cache_read || 0);
const istDay = d => new Date(d.getTime() + 330 * 60000).toISOString().slice(0, 10);
const lastDays = n => [...Array(n)].map((_, i) => istDay(new Date(Date.now() - i * 86400000)));
const colour = p => p >= 85 ? 'var(--red)' : p >= 60 ? 'var(--amber)' : 'var(--green)';
function ago(iso) { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? m + ' min ago' : Math.round(m / 60) + 'h ago'; }
function inIST(iso) { return new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata',
  weekday: 'short', hour: 'numeric', minute: '2-digit' }); }
async function getJSON(path) { try { const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
  return r.ok ? r.json() : null; } catch { return null; } }
function gauge(label, w) { const p = Math.round(w.pct);
  return `<div class="gauge"><div class="top"><span>${label}</span><span style="color:${colour(p)}">${p}% used</span></div>
    <div class="bar"><i style="width:${Math.min(p, 100)}%;background:${colour(p)}"></i></div>
    <div class="muted">Resets ${inIST(w.resets_at)}</div></div>`; }

(async () => {
  const [robot, adhoc, limits, ig, links, audience, feed] = await Promise.all([getJSON('stats/robot.json'), getJSON('stats/adhoc.json'),
    getJSON('stats/limits.json'), getJSON('stats/instagram.json'), getJSON('stats/ig_links.json'), getJSON('stats/audience.json'), getJSON('feed.json')]);
  const boostsData = (await getJSON('stats/boosts.json')) || {};

  // --- 📋 report (daily = yesterday, weekly = last 7 days), all from the collected data
  const cleanTopic = l => (l.tag || '').replace(/[^\w &]/g, '').replace('SAMPLE', '').trim().toUpperCase() || (l.kind || 'news').toUpperCase();
  const istHour = iso => (new Date(iso).getUTCHours() + 5 + (new Date(iso).getUTCMinutes() + 30 >= 60 ? 1 : 0)) % 24;
  function report(period) {
    const now = new Date();
    const todayIST = istDay(now);
    const start = period === 'daily' ? new Date(Date.parse(todayIST + 'T00:00:00+05:30') - 86400000)
                                     : new Date(now.getTime() - 7 * 86400000);
    const end = period === 'daily' ? new Date(Date.parse(todayIST + 'T00:00:00+05:30')) : now;
    const inP = iso => iso && new Date(iso) >= start && new Date(iso) < end;
    const days = []; for (let t = start.getTime(); t < end.getTime(); t += 86400000) days.push(istDay(new Date(t)));
    const label = period === 'daily' ? `Yesterday (${start.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' })})`
      : `Last 7 days (${start.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' })} – today)`;
    // followers
    const fol = (ig && ig.followers) || [];
    const before = [...fol].reverse().find(f => new Date(f.at) <= start) || fol[0];
    const after = [...fol].reverse().find(f => new Date(f.at) <= end) || fol[fol.length - 1];
    // posts made / tokens
    let made = 0, tok = 0;
    for (const d of days) for (const j of Object.values((robot || {})[d] || {})) { made += j.posts; tok += tokens(j); }
    // linked posts with results
    const rows = Object.entries(links || {}).filter(([, l]) => inP(l.posted_at || l.linked_at))
      .map(([id, l]) => ({ id, ...l, res: ((ig && ig.posts) || {})[id] })).filter(r => r.res)
      .map(r => ({ ...r, score: r.res.likes + 2 * r.res.comments }));
    const linkedCount = Object.values(links || {}).filter(l => inP(l.posted_at || l.linked_at)).length;
    const best = [...rows].sort((a, b) => b.score - a.score)[0];
    const group = key => { const m = {}; rows.forEach(r => { const k = key(r); (m[k] = m[k] || []).push(r.score); });
      return Object.entries(m).map(([k, v]) => [k, v.reduce((a, b) => a + b, 0) / v.length, v.length]).sort((a, b) => b[1] - a[1]); };
    const topics = group(cleanTopic);
    const fmt2 = group(r => (r.slides || 1) > 1 ? 'Carousel' : 'Single photo');
    const times = group(r => { const h = istHour(r.posted_at || r.linked_at);
      return h < 11 ? 'Morning (5–11 AM)' : h < 17 ? 'Afternoon (11 AM–5 PM)' : h < 21 ? 'Evening (5–9 PM)' : 'Night (9–11 PM)'; });
    const likes = rows.reduce((a, r) => a + r.res.likes, 0), comments = rows.reduce((a, r) => a + r.res.comments, 0);
    const lines = [];
    lines.push(['👥', before && after ? `Followers: <b>${before.followers} → ${after.followers}</b> (${after.followers - before.followers >= 0 ? '+' : ''}${after.followers - before.followers})` : 'Followers: not tracked yet']);
    lines.push(['📝', `Posts: <b>${made}</b> made by the robot, <b>${linkedCount}</b> posted & linked`]);
    if (rows.length) lines.push(['❤️', `Engagement: <b>${likes}</b> likes · <b>${comments}</b> comments on ${rows.length} linked post${rows.length > 1 ? 's' : ''}`]);
    if (best) lines.push(['🏆', `Best post: <i>${(best.headline || best.id).replace(/</g, '&lt;')}</i> (❤️ ${best.res.likes} · 💬 ${best.res.comments})`]);
    if (topics.length >= 2) {
      lines.push(['👍', `Best topics: ${topics.slice(0, 3).map(t => `<b>${t[0]}</b> (${t[1].toFixed(0)})`).join(', ')}`]);
      if (topics.length > 3) lines.push(['👎', `Weakest: ${topics.slice(-2).map(t => `${t[0]} (${t[1].toFixed(0)})`).join(', ')}: consider fewer of these`]);
    }
    if (fmt2.length === 2 && fmt2.every(f => f[2] >= 2)) {
      const [a, b] = fmt2; lines.push(['🖼️', `Format: <b>${a[0]}</b> posts get ${(a[1] / Math.max(b[1], 0.1)).toFixed(1)}× more engagement than ${b[0].toLowerCase()}`]);
    }
    if (times.length >= 2) lines.push(['🕐', `Best time: <b>${times[0][0]}</b> (avg ${times[0][1].toFixed(0)})`]);
    lines.push(['🤖', audience && audience.summary ? `Robot's plan: ${audience.summary.replace(/</g, '&lt;')}`
      : `Robot's plan: learning starts after 10 linked posts with results.`]);
    const snapNow = limits && limits.length ? limits[limits.length - 1] : null;
    lines.push(['⚡', `Claude: robot used ${fmt(tok)} tokens${snapNow ? `; plan this week ${Math.round(snapNow.seven_day.pct)}% used` : ''}`]);
    const note = rows.length < 3 ? '<div class="muted" style="margin-top:6px">Link more posts with 🔗 Insta link for richer insights (topics, formats, best times).</div>' : '';
    return `<div class="muted" style="margin-bottom:8px">${label}</div><div class="rep">${lines.map(([i, t]) =>
      `<div class="line"><b>${i}</b><span>${t}</span></div>`).join('')}</div>${note}`;
  }
  const repEl = document.getElementById('report');
  let period = (() => { try { return localStorage.getItem('reportPeriod') || 'daily'; } catch { return 'daily'; } })();
  const drawReport = () => {
    repEl.innerHTML = `<h2>📋 Report</h2><div class="seg"><button data-p="daily" class="${period === 'daily' ? 'on' : ''}">Daily</button>
      <button data-p="weekly" class="${period === 'weekly' ? 'on' : ''}">Weekly</button></div>${report(period)}`;
    repEl.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
      period = b.dataset.p; try { localStorage.setItem('reportPeriod', period); } catch {} drawReport(); }));
  };
  drawReport();

  // --- 🚀 boosts: followers at the start of each boost vs now, and the post's likes
  {
    const fol = (ig && ig.followers) || [];
    const at = iso => ([...fol].reverse().find(f => new Date(f.at) <= new Date(iso)) || fol[0] || {}).followers;
    const latest = (fol[fol.length - 1] || {}).followers;
    const rows = Object.entries(boostsData).sort((a, b) => b[1].at.localeCompare(a[1].at)).map(([id, b]) => {
      const res = ((ig && ig.posts) || {})[id], start = at(b.at);
      const gained = start != null && latest != null ? latest - start : null;
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
        <div style="font-weight:600">${(b.headline || id).replace(/</g, '&lt;')}</div>
        <div class="muted">Boosted ${inIST(b.at)} · ${res ? `❤️ ${res.likes} · 💬 ${Math.max(0, res.comments - 1)}` : 'link it with 🔗 to see likes'}
          · followers ${gained != null ? `${start} → ${latest} (<b style="color:var(--green)">${gained >= 0 ? '+' : ''}${gained}</b>)` : 'not tracked yet'}</div></div>`;
    }).join('');
    document.getElementById('boosts').innerHTML = `<h2>🚀 Boosts</h2>${rows ||
      '<div class="muted">No boosted posts yet. Tap 🚀 Boost? on a post in the app after you boost it on Instagram.</div>'}
      <div class="muted" style="margin-top:8px">Boosted posts are left out of the learning (paid reach would mislead it).
      Followers gained counts all new followers since the boost started.</div>`;
  }

  // --- instagram
  {
    const fol = (ig && ig.followers) || [];
    const latest = fol[fol.length - 1];
    const weekAgo = fol.find(f => Date.now() - new Date(f.at) < 7 * 86400000) || fol[0];
    const results = Object.entries((ig && ig.posts) || {}).map(([id, r]) => ({ id, ...r, ...(links || {})[id],
      score: r.likes + 2 * r.comments })).sort((a, b) => b.score - a.score);
    const top = results.slice(0, 5).map(p => `<div class="row" style="grid-template-columns:minmax(0,1fr) 90px">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(p.headline || p.id).replace(/</g, '&lt;')}</span>
      <span class="num">❤️ ${p.likes} · 💬 ${p.comments}</span></div>`).join('');
    const checks = [...fol.map(f => f.at), ...Object.values((ig && ig.posts) || {}).map(p => p.checked_at)].filter(Boolean).sort();
    const lastCheck = checks[checks.length - 1];
    const when = iso => iso ? `${inIST(iso)} (${ago(iso)})` : 'never';
    document.getElementById('insta').innerHTML = `<h2>📈 Instagram @khabarbawaal</h2>
      <div class="muted" style="margin:-4px 0 10px">🕐 Last fetched: <b>${when(lastCheck)}</b>. Your Mac checks every 3 hours while it's awake.</div>
      <div class="kpis"><div class="kpi"><b>${latest ? latest.followers : '–'}</b><span>followers</span></div>
        <div class="kpi"><b>${latest && weekAgo ? (latest.followers - weekAgo.followers >= 0 ? '+' : '') + (latest.followers - weekAgo.followers) : '–'}</b><span>this week</span></div>
        <div class="kpi"><b>${Object.keys(links || {}).length}</b><span>posts linked</span></div></div>
      <h2 style="margin-top:14px">Best posts</h2>${top || '<div class="muted">Link posts with 🔗 Insta link in the app to see their likes here.</div>'}
      <h2 style="margin-top:14px">What the robot learned</h2>
      <div class="muted">🕐 Last analysis: <b>${when(audience && audience.updated)}</b> (runs every night at 4 AM)</div>
      <div class="muted" style="margin-top:6px">${audience && audience.summary ? '✅ Adjusting posts: ' + audience.summary.replace(/</g, '&lt;')
        : audience && audience.waiting ? `⏳ Not adjusting yet: ${audience.waiting}. It starts once posts get real engagement (10+ linked posts and 30+ likes in total), so it learns from your audience, not from noise. Your own pinned comments aren't counted.`
        : `Needs at least 10 linked posts with results (${results.length} so far). Then every night at 4 AM it learns which topics your audience likes and posts more of them.`}</div>`;
  }
  const week = lastDays(7), today = week[0];

  // --- plan
  const snap = limits && limits.length ? limits[limits.length - 1] : null;
  document.getElementById('plan').innerHTML = '<h2>Claude plan usage (Pro)</h2>' + (snap
    ? gauge('5-hour window', snap.five_hour) + gauge('This week', snap.seven_day) +
      `<div class="muted">Includes everything: robot, Claude Code and claude.ai chats.<br>🕐 Last fetched: <b>${inIST(snap.at)} (${ago(snap.at)})</b>, from your Mac hourly while it's awake.</div>`
    : '<div class="muted">Not available yet. It comes from your Mac every hour while it\'s on.</div>');

  // --- robot
  const robotWeek = { posts: 0, requests: 0, tokens: 0, weighted: 0, value: 0, jobs: {}, purposes: {} };
  const robotToday = { posts: 0, tokens: 0, requests: 0 };
  for (const day of week) {
    for (const [job, j] of Object.entries((robot || {})[day] || {})) {
      const t = tokens(j);
      robotWeek.posts += j.posts; robotWeek.requests += j.requests; robotWeek.tokens += t; robotWeek.value += j.value_usd || 0;
      robotWeek.weighted += weighted(j);
      const r = robotWeek.jobs[job] = robotWeek.jobs[job] || { posts: 0, tokens: 0 };
      r.posts += j.posts; r.tokens += t;
      for (const [p, v] of Object.entries(j.by_purpose || {})) robotWeek.purposes[p] = (robotWeek.purposes[p] || 0) + v.tokens;
      if (day === today) { robotToday.posts += j.posts; robotToday.tokens += t; robotToday.requests += j.requests; }
    }
  }
  const maxJob = Math.max(1, ...Object.values(robotWeek.jobs).map(j => j.tokens));
  const jobRows = Object.entries(robotWeek.jobs).sort((a, b) => b[1].tokens - a[1].tokens).map(([job, j]) =>
    `<div class="row"><span>${JOB_NAMES[job] || job}</span><div class="bar"><i style="width:${j.tokens / maxJob * 100}%;background:var(--accent)"></i></div>
     <span class="num">${fmt(j.tokens)} · ${j.posts}</span></div>`).join('');
  const maxP = Math.max(1, ...Object.values(robotWeek.purposes));
  const purposeRows = Object.entries(robotWeek.purposes).sort((a, b) => b[1] - a[1]).map(([p, t]) =>
    `<div class="row"><span>${p[0].toUpperCase() + p.slice(1)}</span><div class="bar"><i style="width:${t / maxP * 100}%;background:var(--blue)"></i></div>
     <span class="num">${fmt(t)}</span></div>`).join('');
  document.getElementById('robot').innerHTML = `<h2>KhabarBawaal robot</h2>
    <div class="kpis"><div class="kpi"><b>${robotToday.posts}</b><span>${robotToday.posts === 1 ? 'post' : 'posts'} today</span></div>
      <div class="kpi"><b>${fmt(robotToday.tokens)}</b><span>tokens today</span></div>
      <div class="kpi"><b>${robotToday.requests}</b><span>AI requests today</span></div></div>
    <div class="muted" style="margin-top:8px">🕐 Last post made: <b>${feed && feed.length ? inIST(feed[0].created_at) + ' (' + ago(feed[0].created_at) + ')' : '–'}</b></div>
    <h2 style="margin-top:16px">Last 7 days by job <span class="muted">(tokens · posts)</span></h2>${jobRows || '<div class="muted">No data yet.</div>'}
    <h2 style="margin-top:16px">What the tokens are spent on</h2>${purposeRows || '<div class="muted">No data yet.</div>'}
    <div class="muted" style="margin-top:10px">7 days: ${robotWeek.posts} posts, ${robotWeek.requests} AI requests, ${fmt(robotWeek.tokens)} tokens.
      Same usage on the paid API would cost about $${robotWeek.value.toFixed(2)}. You don't pay this: it's covered by your plan.</div>`;

  // --- ad hoc
  const adhocWeek = week.reduce((s, d) => s + tokens((adhoc || {})[d] || {}), 0);
  const adhocWeekW = week.reduce((s, d) => s + weighted((adhoc || {})[d] || {}), 0);
  const adhocToday = tokens((adhoc || {})[today] || {});
  const totalW = robotWeek.weighted + adhocWeekW;
  const robotShare = totalW ? robotWeek.weighted / totalW : 0;
  document.getElementById('adhoc').innerHTML = `<h2>Your own Claude use (Claude Code on your Mac)</h2>
    <div class="kpis"><div class="kpi"><b>${fmt(adhocToday)}</b><span>tokens today</span></div>
      <div class="kpi"><b>${fmt(adhocWeek)}</b><span>last 7 days</span></div>
      <div class="kpi"><b>${Math.round((1 - robotShare) * 100)}%</b><span>of tracked use*</span></div></div>
    <div class="bar" style="margin-top:12px;height:14px"><i style="width:${robotShare * 100}%;background:var(--accent)"></i></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Robot ${Math.round(robotShare * 100)}%</span>
      <span><i style="background:#262626"></i>You ${Math.round((1 - robotShare) * 100)}%</span></div>
    <div class="muted" style="margin-top:10px">*Weighted by how much tokens count against your plan (cached tokens count about a tenth).
      ${adhoc ? '' : 'Not available yet (sent from your Mac hourly while it\'s on). '}
      claude.ai website and phone chats can't be tracked here. See them at
      <a class="link" href="https://claude.ai/settings/usage" target="_blank" rel="noopener">claude.ai → Settings → Usage</a>.</div>`;

  // --- capacity estimate
  const cap = document.getElementById('capacity');
  if (!snap || robotWeek.posts < 10) {
    cap.innerHTML = `<h2>Room for more posts</h2><div class="muted">Collecting data (${robotWeek.posts}/10 robot posts tracked).
      The estimate appears once at least 10 posts and your plan usage are recorded.</div>`;
    return;
  }
  const w = snap.seven_day, reset = new Date(w.resets_at).getTime(), now = Date.now();
  const elapsed = Math.min(1, Math.max(0.05, 1 - (reset - now) / (7 * 86400000)));
  const robotPct = w.pct * robotShare, youPct = w.pct - robotPct;   // split of the week's usage so far
  const split = `<div class="muted" style="margin-top:8px">This week so far: 🤖 robot ≈ <b>${robotPct.toFixed(1)}%</b> · 👤 you ≈ <b>${youPct.toFixed(1)}%</b>
    (robot alone ≈ ${(robotPct / elapsed).toFixed(0)}% by the weekly reset at this pace)</div>`;
  if (elapsed < 1 / 7) {   // first day: one busy chat would make any projection look alarming
    cap.innerHTML = `<h2>Room for more posts</h2>
      <div class="kpis"><div class="kpi"><b>${Math.round(w.pct)}%</b><span>week used so far</span></div>
        <div class="kpi"><b>–</b><span>projection after day 1</span></div>
        <div class="kpi"><b>${inIST(w.resets_at)}</b><span>weekly reset</span></div></div>${split}
      <div class="muted" style="margin-top:6px">The week only just started, so the projection appears after the first day.</div>`;
    return;
  }
  const projected = w.pct / elapsed;                              // where this week ends at today's pace
  const daysLeft = Math.max(0.5, (reset - now) / 86400000);
  const perPost = (w.pct * robotShare) / robotWeek.posts;          // % of weekly limit per robot post (approx.)
  const headroom = 90 - projected;                                 // keep 10% spare for your own chats
  const extraPerDay = perPost > 0 ? Math.floor(headroom / perPost / daysLeft) : 0;
  const cls = projected >= 100 ? 'over' : projected >= 80 ? 'tight' : 'ok';
  const msg = cls === 'over' ? (youPct > robotPct * 2
      ? `❌ At this pace you'd run out before the reset, mostly from your own chats. Start fresh chats to save.`
      : `❌ At this pace you'd run out before the weekly reset. Consider fewer posts.`)
    : cls === 'tight' ? `⚠️ Tight: little room left this week.` : `✅ Safe: current schedule fits comfortably.`;
  cap.innerHTML = `<h2>Room for more posts</h2>
    <div class="kpis"><div class="kpi"><b>${Math.round(w.pct)}%</b><span>week used so far</span></div>
      <div class="kpi"><b>${Math.round(projected)}%</b><span>projected by reset</span></div>
      <div class="kpi"><b>${extraPerDay > 0 ? '+' + extraPerDay : 0}</b><span>more posts/day fit</span></div></div>
    <div class="verdict ${cls}">${msg}</div>${split}
    <div class="muted" style="margin-top:8px">Estimate: one robot post ≈ ${perPost.toFixed(2)}% of the weekly limit. Keeps 10% spare
      for your own chats. claude.ai chats aren't tracked, so heavy chatting there makes this optimistic.</div>`;
})();
</script>
</body>
</html>
