<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0d0d0d; --card: #1a1a1a; --line: #2a2a2a; --text: #f2f2f2; --muted: #9a9a9a;
    --accent: #FFD400; --red: #E50914;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,13,13,.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: .5px; }
  .brand span { color: var(--accent); }
  .status { color: var(--muted); font-size: 12px; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; width: 40px; height: 40px; font-size: 18px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 24px); }
  .post { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; margin-bottom: 20px; }
  .post img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #222; }
  .meta { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; font-size: 12px; color: var(--muted); }
  .tag.fun { background: var(--accent); color: #000; }
  .tag { background: var(--red); color: #fff; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
  .new { background: var(--accent); color: #000; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
  .caption { padding: 10px 14px 0; font-size: 14px; white-space: pre-wrap; color: #ddd;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .caption.open { -webkit-line-clamp: unset; display: block; }
  .actions { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; padding: 12px 14px 14px; }
  .actions .primary { grid-column: 1 / -1; padding: 14px 6px; font-size: 16px; }
  .actions button, .actions a { border: 0; border-radius: 10px; padding: 12px 6px; font-size: 14px;
    font-weight: 600; text-align: center; text-decoration: none; white-space: nowrap; color: var(--text); background: #262626; }
  .actions .primary { background: var(--accent); color: #000; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; pointer-events: none;
    background: #fff; color: #000; padding: 10px 18px; border-radius: 999px; font-weight: 600;
    font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
  .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel img { flex: 0 0 100%; scroll-snap-align: center; }
  .opt-label { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0 0; }
  .opt-label b { color: var(--accent); }
  .tag.custom { background: #2f80ed; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.7); display: flex; align-items: flex-end; }
  .sheet[hidden] { display: none; }
  .sheet-box { width: 100%; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); display: flex; flex-direction: column; gap: 10px; }
  .sheet-box h2 { margin: 0; font-size: 18px; }
  .sheet-box p { margin: 0; color: var(--muted); font-size: 13px; }
  .sheet-box textarea { width: 100%; min-height: 120px; border-radius: 10px; border: 1px solid var(--line); background: #111;
    color: var(--text); font: 16px/1.4 inherit; padding: 10px; resize: vertical; }
  .sheet-box .row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .sheet-box button { border: 0; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700; background: #262626; color: var(--text); }
  .sheet-box button.primary { background: var(--accent); color: #000; }
  .head-btns { display: flex; gap: 8px; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand" id="brand">Studio</div>
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="head-btns">
    <button class="icon-btn" id="create" aria-label="Create post">➕</button>
    <button class="icon-btn" id="refresh" aria-label="Refresh">↻</button>
  </div>
</header>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <h2>✍️ Create a post</h2>
    <p>Paste a news link, or write the news in your own words. GitHub opens: tap <b>Create</b> there. Your post appears here in 2–3 minutes with photo options.</p>
    <textarea id="create-input" placeholder="https://… or e.g. Virat Kohli announces retirement from T20s"></textarea>
    <div class="row">
      <button type="button" id="create-cancel">Cancel</button>
      <button type="button" class="primary" id="create-go">Create post</button>
    </div>
  </div>
</div>
<main id="feed"></main>
<div id="toast"></div>

<script>
const feedEl = document.getElementById('feed');
const statusEl = document.getElementById('status');
const toastEl = document.getElementById('toast');
const files = {};      // image path -> File, ready for the share sheet
const pending = {};    // image path -> Promise<File>
const chosen = {};     // post id -> picked option index (posts with photo options)
let posts = [];

function currentImage(post) {
  return post.options ? post.options[chosen[post.id] || 0] : post.image;
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const h = Math.round(mins / 60);
  return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// iOS only allows the share sheet straight from a tap, so the image file
// is fetched ahead of time (when the card scrolls into view).
function prepare(post) {
  const src = currentImage(post);
  if (!pending[src]) {
    pending[src] = fetch(src).then(r => r.blob()).then(b => {
      files[src] = new File([b], src.split('/').pop(), { type: 'image/jpeg' });
      return files[src];
    }).catch(err => { delete pending[src]; throw err; });
  }
  return pending[src];
}

// Comment to paste under the post and pin (Instagram doesn't make links in captions clickable).
function commentText(post) {
  if (post.kind === 'fun') return 'Tag karo 3 dosto ko jo ye dekh ke pakka hasenge 😂👇';
  if (!post.source_url) return 'Aap kya sochte ho? Comment mein batao 👇';
  return `🔗 Source: ${post.source_url}`;
}

async function copyComment(post) {
  try {
    await navigator.clipboard.writeText(commentText(post));
    toast(post.kind === 'fun' ? 'Comment copied — paste & pin it 📌' : 'Link copied — paste as comment, then pin it 📌');
  } catch {
    toast('Could not copy — open 🔗 Story and copy the link');
  }
}

async function copyCaption(post) {
  try {
    await navigator.clipboard.writeText(post.caption);
    toast('Caption copied ✓');
  } catch {
    toast('Could not copy — long-press the caption to copy');
  }
}

async function share(post) {
  const file = files[currentImage(post)];
  if (!file) {
    toast('Preparing image… tap again');
    prepare(post);
    return;
  }
  navigator.clipboard.writeText(post.caption).catch(() => {});
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      toast('Caption copied — after posting, tap 💬 Comment for the link');
    } catch (e) {
      if (e.name !== 'AbortError') toast('Share failed: ' + e.message);
    }
  } else {
    window.open(currentImage(post), '_blank');
    toast('Long-press the image to save it');
  }
}

const observer = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting) {
      const post = posts.find(p => p.id === e.target.dataset.id);
      if (post) prepare(post).catch(() => {});
    }
  }
}, { rootMargin: '400px' });

function render() {
  if (!posts.length) {
    feedEl.innerHTML = '<div class="empty">No posts yet.<br>The first one appears after the next hourly run.</div>';
    return;
  }
  const lastSeen = localGet('lastSeen');
  feedEl.innerHTML = posts.map(p => `
    <article class="post" data-id="${p.id}">
      ${p.options && p.options.length > 1 ? `
      <div class="carousel">${p.options.map(o => `<img src="${o}" alt="${esc(p.headline)}" loading="lazy">`).join('')}</div>
      <div class="opt-label">Option <b>1</b> of ${p.options.length} · swipe ← → to choose, then tap Post</div>`
      : `<img src="${p.image}" alt="${esc(p.headline)}" loading="lazy">`}
      <div class="meta">
        <span class="tag${p.kind === 'fun' ? ' fun' : p.kind === 'custom' ? ' custom' : ''}">${p.kind === 'custom' ? '✍️ YOUR PICK · ' : ''}${esc(p.tag || 'NEWS')}</span>
        ${lastSeen && p.created_at > lastSeen ? '<span class="new">NEW</span>' : ''}
        <span>${ago(p.created_at)} · ${esc(p.source)}</span>
      </div>
      <div class="caption">${esc(p.caption)}</div>
      <div class="actions">
        <button class="primary" data-act="share">📤 Post</button>
        <button data-act="copy">📋 Caption</button>
        <button data-act="comment">💬 Comment</button>
        ${p.source_url ? `<a href="${p.source_url}" target="_blank" rel="noopener">🔗 Story</a>` : '<button data-act="whatsapp">🟢 WhatsApp</button>'}
      </div>
    </article>`).join('');
  feedEl.querySelectorAll('.post').forEach(el => observer.observe(el));
  localSet('lastSeen', posts[0].created_at);
}

feedEl.addEventListener('click', e => {
  const card = e.target.closest('.post');
  if (!card) return;
  const post = posts.find(p => p.id === card.dataset.id);
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'share') share(post);
  else if (act === 'copy') copyCaption(post);
  else if (act === 'comment') copyComment(post);
  else if (act === 'whatsapp') share(post);
  else if (e.target.classList.contains('caption')) e.target.classList.toggle('open');
});

// Track which photo option is showing.
feedEl.addEventListener('scroll', e => {
  const c = e.target;
  if (!c.classList || !c.classList.contains('carousel')) return;
  const card = c.closest('.post');
  const post = posts.find(p => p.id === card.dataset.id);
  const i = Math.round(c.scrollLeft / c.clientWidth);
  if (chosen[post.id] !== i) {
    chosen[post.id] = i;
    card.querySelector('.opt-label b').textContent = i + 1;
    prepare(post).catch(() => {});
  }
}, true);

// ➕ Create: opens a GitHub issue (only the owner's issues are processed).
const sheet = document.getElementById('sheet');
const createInput = document.getElementById('create-input');
document.getElementById('create').addEventListener('click', () => { sheet.hidden = false; createInput.focus(); });
document.getElementById('create-cancel').addEventListener('click', () => { sheet.hidden = true; });
document.getElementById('create-go').addEventListener('click', () => {
  const text = createInput.value.trim();
  if (!text) { toast('Paste a link or write the news first'); return; }
  const owner = location.hostname.endsWith('github.io') ? location.hostname.split('.')[0] : 'vikashlal12345';
  const repo = location.pathname.split('/').filter(Boolean)[0] || 'khabarbawaal-studio';
  const url = `https://github.com/${owner}/${repo}/issues/new?title=${encodeURIComponent('Create post')}&body=${encodeURIComponent(text)}`;
  sheet.hidden = true;
  createInput.value = '';
  toast('Tap Create in GitHub — post arrives in 2–3 min');
  // New tab keeps the app open; falls back to same-tab if the browser blocks it.
  if (!window.open(url, '_blank')) window.location.href = url;
});

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

async function load() {
  statusEl.textContent = 'Refreshing…';
  try {
    const res = await fetch('feed.json?t=' + Date.now(), { cache: 'no-store' });
    posts = await res.json();
    render();
    statusEl.textContent = posts.length
      ? `${posts.length} posts · latest ${ago(posts[0].created_at)}`
      : 'Waiting for first post';
  } catch {
    statusEl.textContent = 'Offline — showing saved posts';
  }
}

// Brand name comes from manifest.json (written by make_brand.py from config.json).
fetch('manifest.json').then(r => r.json()).then(m => {
  const [first, ...rest] = m.short_name.match(/[A-Z0-9]?[a-z0-9]+|[A-Z0-9]+(?![a-z])/g) || [m.short_name];
  document.getElementById('brand').innerHTML = `${esc(first)}<span>${esc(rest.join(''))}</span> Studio`;
  document.title = m.name;
}).catch(() => {});

document.getElementById('refresh').addEventListener('click', load);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
