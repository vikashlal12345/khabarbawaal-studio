name: Cartoon ideas test
# Manual only: makes the AI-cartoon follower test Reels in a temporary folder and attaches the videos. Posts nothing, saves nothing to the app.
on:
  workflow_dispatch:
    inputs:
      ideas:
        description: "Idea names, space separated (empty = both)"
        required: false
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: python -u tools/toon_ideas.py ${{ inputs.ideas }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toon-ideas
          path: toon_out/ideas/
          if-no-files-found: ignore
