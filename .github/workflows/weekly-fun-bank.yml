name: Weekly fun bank refresh

# Every Sunday 08:00 IST: drop backup jokes older than 14 days and write 30 fresh ones,
# so the fallback never serves old jokes.
on:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-post        # never runs at the same time as the hourly post
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g @anthropic-ai/claude-code
      - run: python fun.py --bank 30
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add assets/fun_bank.json
          git diff --cached --quiet || git commit -m "Refresh fun bank $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
