name: X probe
# Manual only: can GitHub's computers read an official temple account's videos from X? Prints the result; posts nothing.
on:
  workflow_dispatch:
    inputs:
      handle:
        description: "X account (without @)"
        default: "Somnath_Temple"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u tools/x_probe.py ${{ inputs.handle }}
