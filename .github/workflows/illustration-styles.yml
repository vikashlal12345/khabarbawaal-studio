name: Illustration styles test
# Manual only: builds a ➕ Create cartoon request from a text file in a temporary folder and attaches the video. Posts nothing, saves nothing to the app.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: python -u tools/illustration_styles.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustration-styles
          path: toon_out/styles/
          if-no-files-found: ignore
