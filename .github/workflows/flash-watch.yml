name: Flash watch

# Every 30 min (no AI, ~1 min): ⚡ a big film star in 6+ sites' news (4+ if also trending on X) that our Reels have not covered is pinned to the
# NEXT news / breaking slot (no extra Reel); 🔁 a winning Reel gets a follow-up pinned to a later slot. See flash.py.
on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: flash-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Look for a flash story and a winner to follow up
        run: |
          python flash.py
      - name: Save the pin
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          python save.py "Flash watch $(date -u +%Y-%m-%dT%H:%MZ)"
