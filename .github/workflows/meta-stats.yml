name: Instagram numbers (Meta API)

# Reads the page's numbers from Meta's official Graph API (read-only) into docs/stats/instagram_api.json.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Only test the connection (prints a few lines, saves nothing)"
        type: boolean
        default: true
      discover:
        description: "Test Business Discovery on these usernames (comma separated), nothing is saved"
        type: string
        default: ""
  schedule:
    - cron: "25 * * * *"       # every hour at :25 (the post chain starts at :07)

permissions:
  contents: write

concurrency:
  group: meta-stats          # its own group: it must never queue behind (or replace) a post run
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look at one page
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.discover, 'look:') }}
        run: python meta_stats.py --look "${{ inputs.discover }}"
      - name: Business Discovery test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.discover != '' && !startsWith(inputs.discover, 'look:') }}
        run: python meta_stats.py --discover "${{ inputs.discover }}"
      - name: Save the competitor numbers (discover = all)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.discover == 'all' }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          python save.py "Competitor numbers $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe && inputs.discover == '' }}
        run: python meta_stats.py --probe
      - name: Read numbers
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || inputs.discover != '')) }}
        run: python meta_stats.py
      - name: Upload
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || inputs.discover != '')) }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          python save.py "Instagram numbers $(date -u +%Y-%m-%dT%H:%MZ)"
