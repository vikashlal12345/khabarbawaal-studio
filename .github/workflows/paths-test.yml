name: App paths test (Create + Remake)
# Manual only: makes the chosen slots' Reels like the robot in a temporary folder, checks them and attaches the videos. Posts nothing, saves nothing to the app.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: python -u tools/ci_test_paths.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-paths
          path: paths_out/
          if-no-files-found: ignore

