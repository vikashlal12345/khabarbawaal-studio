name: Hourly post

# Two ways this runs every hour:
#  1. A chain: after each post, the "next" job waits until the next :07 and starts
#     this workflow again (workflow_dispatch from GITHUB_TOKEN is allowed to do that).
#  2. GitHub's own timer (schedule) as a backup. It also restarts the chain if it broke.
# --min-gap 40 on timed runs stops double posts when both fire in the same hour.
on:
  schedule:
    # Backup for the chain (IST = UTC + 5:30); only posts if the chain has stopped.
    - cron: "30 23,0-16 * * *"    # hh:00 IST, 5 AM - 10 PM
    - cron: "0 2-5,13-17 * * *"   # hh:30 IST in peak hours (7:30-10:30 AM, 6:30-10:30 PM)
    - cron: "45 0,2,3,15 * * *"   # 6:15, 8:15, 9:15 AM and 9:15 PM IST specials
    - cron: "15 10 * * 1-5"       # 3:45 PM IST closing bell (weekdays)
    - cron: "39 3 * * 1-5"        # 9:09 AM IST pre-open snapshot (weekdays)
  workflow_dispatch:
    inputs:
      kind:
        description: "Post type"
        type: choice
        options: [auto, news, fun, top10_viral, top10_day, thought, market_open, market_preopen, market_close,
                  night_roundup, night_ready, night_calendar, night_jokes, night_learn]
        default: auto
      test_alert:
        description: "Also send a test alert email"
        type: boolean
        default: false
      chain:
        description: "Timed run from the chain (leave unticked for an instant post)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: hourly-post        # takes turns with "Create post" requests
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Membership mode: token from `claude setup-token` (uses your Claude plan, no API bill).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Paid mode, only if you ever add this secret.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TIMED: ${{ github.event_name == 'schedule' || inputs.chain }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code (membership mode)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Is the chain alive? (backup timer runs only step in if not)
        id: chain
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w hourly.yml -L 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")
          echo "skip=$([ "$busy" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$busy" != "0" ] && echo "Chain is running: backup timer does nothing." || true

      - name: Create post
        if: steps.chain.outputs.skip != 'true'
        run: |
          GAP=0; [ "$TIMED" = "true" ] && GAP=20
          python generate.py --kind "${{ inputs.kind || 'auto' }}" --min-gap "$GAP"

      - name: Email alerts (as GitHub issues)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python notify.py
          if [ "${{ inputs.test_alert }}" = "true" ]; then python notify.py --test; fi

      - name: Save post to repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          python save.py "New post $(date -u +%Y-%m-%dT%H:%MZ)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

  next:
    # Keeps the hourly chain going. Runs even if the post failed, so one bad hour
    # doesn't stop the robot.
    needs: generate
    if: always() && (github.event_name == 'schedule' || inputs.chain)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the next posting slot, then start the next run
        run: |
          busy() {   # other hourly runs that are running or waiting (any trigger)
            gh run list -R "$GITHUB_REPOSITORY" -w hourly.yml -L 20 --json databaseId,status \
              -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length"
          }
          queued_chain() {   # a chain run already dispatched and waiting to start
            gh run list -R "$GITHUB_REPOSITORY" -w hourly.yml -e workflow_dispatch -L 20 --json databaseId,status \
              -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.status == \"queued\" or .status == \"pending\" or .status == \"waiting\"))] | length"
          }
          # A timer run only (re)starts the chain if nothing else is running (the chain sleeps
          # inside a running job, so a live chain always shows up here).
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(busy)" != "0" ]; then
            echo "Chain already running: nothing to do."; exit 0
          fi
          wait=$(python3 schedule.py next-wait)   # next posting slot (IST); skips quiet hours
          if [ "$wait" -gt 19800 ]; then
            # Overnight: a job can only run 6 hours, so wait 5h30m and hand over to a new run,
            # which waits the rest.
            echo "Quiet hours: waiting 330 minutes, then handing over"; sleep 19800
          else
            echo "Next post in $((wait / 60)) minutes"; sleep "$wait"
          fi
          if [ "$(queued_chain)" != "0" ]; then echo "A chain run is already queued."; exit 0; fi
          gh workflow run hourly.yml -R "$GITHUB_REPOSITORY" -f chain=true
