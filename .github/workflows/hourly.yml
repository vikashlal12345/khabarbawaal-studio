name: Hourly post

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (GitHub may delay a few minutes)
  workflow_dispatch:       # "Run workflow" button for an instant post
    inputs:
      test_alert:
        description: "Also send a test alert email"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: hourly-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Membership mode: token from `claude setup-token` (uses your Claude plan, no API bill).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Paid mode, only if you ever add this secret.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code (membership mode)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Create post
        run: python generate.py

      - name: Email alerts (as GitHub issues)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python notify.py
          if [ "${{ inputs.test_alert }}" = "true" ]; then python notify.py --test; fi

      - name: Save post to repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "New post $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
